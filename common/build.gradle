import groovy.json.JsonOutput
import org.gradle.api.artifacts.ProjectDependency

plugins { id 'java-library' }

def commonRoot = buildFile.canonicalFile.parentFile
def templeRoot = commonRoot.parentFile
def identity = new Properties()
new File(templeRoot, 'gradle.properties').withReader('UTF-8') { identity.load(it) }
def targetId = rootProject.projectDir.name
def activeFile = new File(templeRoot, '.temple/active-target')
def active = (activeFile.isFile() ? activeFile.getText('UTF-8').trim() : identity.getProperty('temple_default_target')) == targetId
group = identity.getProperty('mod_group_id')
version = identity.getProperty('mod_version')
base.archivesName = "${identity.getProperty('mod_id')}-common-${targetId}"
layout.buildDirectory.set(new File(commonRoot, "build/${targetId}"))
java {
    toolchain.languageVersion = JavaLanguageVersion.of(rootProject.property('java_version') as int)
    withSourcesJar()
}
repositories { mavenCentral() }

def compatRoot = new File(commonRoot, 'src/compat').canonicalFile
def layers = [new File(commonRoot, 'src/main')] + rootProject.property('temple_compatibility').toString().split(',').collect { name ->
    def layer = new File(compatRoot, name.trim()).canonicalFile
    if (layer == compatRoot || !layer.toPath().startsWith(compatRoot.toPath())) {
        throw new GradleException("Invalid compatibility layer: ${name}")
    }
    layer
}
def javaDirectories = layers.collect { new File(it, 'java') }.findAll { it.isDirectory() }
def resourceDirectories = (layers.drop(1) + [layers.first()]).collect { new File(it, 'resources') }.findAll { it.isDirectory() }
def packageName = identity.getProperty('mod_java_package', identity.getProperty('mod_group_id'))
def constants = new File(layout.buildDirectory.get().asFile, 'generated/sources/temple')
def constantFile = new File(constants, "${packageName.replace('.', '/')}/BuildInfo.java")
def constantText = "package ${packageName};\n\npublic final class BuildInfo {\n" +
        "    public static final String MOD_ID = ${JsonOutput.toJson(identity.getProperty('mod_id'))};\n" +
        "    private BuildInfo() {}\n}\n"
if (!constantFile.isFile() || constantFile.getText('UTF-8') != constantText) {
    constantFile.parentFile.mkdirs()
    constantFile.setText(constantText, 'UTF-8')
}
sourceSets {
    main {
        java.setSrcDirs(active ? javaDirectories + [constants] : [])
        resources.setSrcDirs(active ? resourceDirectories : [])
    }
    test {
        java.setSrcDirs(active ? [new File(commonRoot, 'src/test/java')] : [])
        resources.setSrcDirs(active ? [new File(commonRoot, 'src/test/resources')] : [])
    }
}
tasks.named('compileJava', JavaCompile) { source javaDirectories, constants }
tasks.named('compileTestJava', JavaCompile) { source new File(commonRoot, 'src/test/java') }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = rootProject.property('java_version') as int
}
tasks.named('processResources', ProcessResources) {
    from resourceDirectories
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('processTestResources', ProcessResources) { from new File(commonRoot, 'src/test/resources') }
tasks.named('sourcesJar', Jar) {
    from javaDirectories
    from constants
    from resourceDirectories
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
def commonPath = path
def commonSourceSets = sourceSets
rootProject.afterEvaluate {
    def sdk = rootProject.configurations.compileClasspath.copyRecursive { dependency ->
        !(dependency instanceof ProjectDependency && dependency.path == commonPath)
    }
    commonSourceSets.main.compileClasspath += sdk
    commonSourceSets.test.compileClasspath += sdk
    def targetCompile = rootProject.tasks.named('compileJava', JavaCompile).get()
    // The common compiler produces the target's Mixin mappings and refmap.
    targetCompile.onlyIf('Compile target-local sources when present') { task -> !task.source.empty }
    tasks.named('compileJava', JavaCompile) {
        options.annotationProcessorPath = rootProject.configurations.annotationProcessor
        options.compilerArgumentProviders.addAll(targetCompile.options.compilerArgumentProviders)
        options.compilerArgs.addAll(targetCompile.options.compilerArgs.collect { argument ->
            argument.startsWith('-AoutRefMapFile=')
                    ? '-AoutRefMapFile=' + new File(destinationDirectory.get().asFile, 'xaeroearth.refmap.json').absolutePath
                    : argument
        })
        targetCompile.options.compilerArgs.findAll { it.startsWith('-AoutMapFileNamedIntermediary=') }.each { argument ->
            outputs.file(argument.substring(argument.indexOf('=') + 1)).withPropertyName('mixinMappings')
        }
    }
}
ext.templeResourceDirectories = resourceDirectories
ext.templeSourceDirectories = javaDirectories + [constants]
