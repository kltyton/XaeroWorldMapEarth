plugins { id 'base' }

def targets = ['forge-1.18.2': 17, 'forge-1.19.2': 17, 'forge-1.20.1': 17,
               'fabric-1.20.1': 17, 'fabric-1.21.1': 21, 'fabric-26.1.2': 25,
               'neoforge-1.21.1': 21, 'neoforge-26.1.2': 25, 'neoforge-26.2': 25]
tasks.register('buildAll') {
    doLast {
        targets.each { target, javaVersion ->
            def wrapper = org.gradle.internal.os.OperatingSystem.current().isWindows()
                    ? 'gradlew.bat' : 'gradlew'
            exec {
                workingDir file("targets/${target}")
                def javaHome = System.getenv("JAVA${javaVersion}_HOME")
                if (javaHome) environment 'JAVA_HOME', javaHome
                def args = [file("targets/${target}/${wrapper}").absolutePath, 'build', '--no-daemon']
                def toolchainPaths = project.findProperty('org.gradle.java.installations.paths')
                if (toolchainPaths) args.add("-Porg.gradle.java.installations.paths=${toolchainPaths}")
                commandLine args
            }
        }
    }
}
tasks.named('build') { dependsOn 'buildAll' }
