import groovy.json.JsonGenerator

def templeRoot = file('../..')
def identity = new Properties()
new File(templeRoot, 'gradle.properties').withReader('UTF-8') { identity.load(it) }
identity.each { key, value ->
    if (!project.hasProperty(key.toString())) ext.set(key.toString(), value.toString())
}
def localSettings = new File(templeRoot, 'temple.local.properties')
if (localSettings.isFile() && !project.hasProperty('kuiJar')) {
    def local = new Properties()
    localSettings.withReader('UTF-8') { local.load(it) }
    def configuredJar = local.getProperty("kuiJar.${project.projectDir.name}", local.getProperty('kuiJar'))
    if (configuredJar) ext.kuiJar = configuredJar
}
group = mod_group_id
version = mod_version

base {
    archivesName = project.name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'Xaero'
        url = 'https://chocolateminecraft.com/maven'
        content {
            includeGroup 'xaero.map'
            includeGroup 'xaero.lib'
        }
    }
}

// Supply the matching local KUI target JAR containing the basic chunk rendering API.
if (project.hasProperty('kuiJar')) {
    def localKuiJar = file(project.property('kuiJar'))
    if (!localKuiJar.isFile()) {
        throw new GradleException("KUI JAR does not exist: ${localKuiJar}")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(java_version)
}

tasks.withType(Jar).configureEach {
    from(file('../../LICENSE')) {
        into 'META-INF'
    }
    from(file('../../licenses')) {
        into 'META-INF/licenses'
    }
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def props = [mod_version: project.version, minecraft_version: minecraft_version,
                 java_version: java_version, loader_version: loader_version,
                 minecraft_version_range: minecraft_version_range,
                 loader_version_range: loader_version_range,
                 mod_id: mod_id, mod_name: mod_name, mod_authors: mod_authors,
                 mod_license: mod_license, mod_description: mod_description,
                 mod_group_id: mod_group_id,
                 mod_java_package: findProperty('mod_java_package') ?: mod_group_id,
                 fml_version_range: findProperty('fml_version_range') ?: '']
    def json = new JsonGenerator.Options().disableUnicodeEscaping().build()
    def escaped = props.collectEntries { key, value ->
        def encoded = json.toJson(value.toString()).replace('\u007f', '\\u007f')
        [(key): encoded.substring(1, encoded.length() - 1)]
    }
    inputs.properties(props)
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        filter { line -> line.replaceAll(/\$\{([a-z_]+)\}/) { match, key -> escaped.containsKey(key) ? escaped[key] : match } }
    }
}

evaluationDependsOn(':common')
def common = project(':common')
dependencies { implementation project(':common') }
sourceSets.main.output.classesDirs.setFrom(common.sourceSets.main.output.classesDirs)
def resourceLayers = [file('src/main/resources')] + common.templeResourceDirectories
project.ext.templeDatagenExistingArgs = resourceLayers.findAll { it.isDirectory() }.reverse()
        .collectMany { ['--existing', it.absolutePath] } as String[]
sourceSets {
    main {
        resources.setSrcDirs([resourceLayers.first(), file('src/generated/resources')])
    }
}
tasks.named('sourcesJar', Jar) {
    from common.templeSourceDirectories
    from common.templeResourceDirectories
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('processResources', ProcessResources) { from common.templeResourceDirectories }
tasks.named('jar', Jar) {
    manifest.attributes('Implementation-Version': project.version.toString())
    from common.sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.register('distributionJar') {
    group = 'build'
    description = 'Assemble the release JAR and record its path for the root controller.'
    dependsOn tasks.named('assemble')
    def releaseTask = tasks.findByName('reobfJar')
    if (releaseTask != null) { dependsOn releaseTask }
    doLast {
        def remapped = tasks.findByName('remapJar')
        def reobfuscated = tasks.findByName('reobfJar')
        def production = remapped instanceof AbstractArchiveTask ? remapped :
                (reobfuscated instanceof AbstractArchiveTask ? reobfuscated : tasks.named('jar', Jar).get())
        def artifact = production.archiveFile.get().asFile
        def record = layout.buildDirectory.file('temple/artifact.properties').get().asFile
        record.parentFile.mkdirs()
        record.setText("artifact=${artifact.absolutePath.replace('\\', '/')}\n", 'UTF-8')
    }
}
