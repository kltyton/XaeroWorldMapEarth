apply from: '../../gradle/target-conventions/base.gradle'
apply from: '../../gradle/target-conventions/publish.gradle'

legacyForge {
    accessTransformers { file('src/main/resources/META-INF/accesstransformer.cfg') }
    version = "${minecraft_version}-${loader_version}"
    mods {
        xaeroearth { sourceSet(sourceSets.main) }
    }
}

dependencies {
    // Xaero requires the :dev classifier with Mojang mappings before 1.21.1.
    implementation "xaero.map:xaeroworldmap-forge-${xaero_mc_version}:${xaero_version}:dev"
    if (project.hasProperty('kuiJar')) compileOnly files(file(project.property('kuiJar')))
}
