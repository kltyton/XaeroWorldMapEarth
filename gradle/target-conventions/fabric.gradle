apply from: '../../gradle/target-conventions/base.gradle'
apply from: '../../gradle/target-conventions/kui.gradle'
apply from: '../../gradle/target-conventions/publish.gradle'

loom {
    mods {
        xaeroearth {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (!minecraft_version.startsWith('26.')) {
        mappings loom.officialMojangMappings()
    }
    if (minecraft_version.startsWith('26.')) {
        implementation "net.fabricmc:fabric-loader:${loader_version}"
        implementation "xaero.map:xaeroworldmap-fabric-${xaero_mc_version}:${xaero_version}"
    } else {
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "xaero.map:xaeroworldmap-fabric-${xaero_mc_version}:${xaero_version}"
    }
}
