def loader = projectDir.name.substring(0, projectDir.name.indexOf('-'))
def kuiMinecraft = minecraft_version == '26.1.2' ? '26.1' : xaero_mc_version
def moduleName = "KltytonUI-${loader}-${kuiMinecraft}"
def kui = "io.github.kltyton.kltytonui:${moduleName}:${kui_version}"
def localPath = findProperty('kuiJar')
def localJar = localPath == null ? null : file(localPath)

if (localJar) {
    new java.util.jar.JarFile(localJar).withCloseable { archive ->
        def version
        if (loader == 'fabric') {
            def metadata = archive.getEntry('fabric.mod.json')
            def mod = metadata == null ? null : archive.getInputStream(metadata).withCloseable {
                new groovy.json.JsonSlurper().parse(it)
            }
            version = mod?.id == 'kltytonui' ? mod.version : null
        } else {
            def metadata = loader == 'forge' ? 'META-INF/mods.toml' : 'META-INF/neoforge.mods.toml'
            def entry = archive.getEntry(metadata)
            if (entry != null) {
                version = archive.manifest?.mainAttributes?.getValue('Implementation-Version')
                if (loader == 'neoforge') {
                    def descriptor = archive.getInputStream(entry).withCloseable { it.getText('UTF-8') }
                    def mod = descriptor.split(/(?m)(?=^[ \t]*\[)/).find { block ->
                        block.trim().startsWith('[[mods]]') &&
                                (block =~ /(?m)^\h*modId\h*=\h*"kltytonui"\h*$/).find()
                    }
                    def declared = (mod ?: '') =~ /(?m)^\h*version\h*=\h*"([^"]+)"\h*$/
                    if (!declared.find()) version = null
                    else if (declared.group(1) != '${file.jarVersion}') version = declared.group(1)
                }
            }
        }
        if (version?.toString() != kui_version.toString()
                || archive.getEntry('io/github/kltyton/kltytonui/chunkmap/KuiNativeTerrainRenderer.class') == null) {
            throw new GradleException("Expected KltytonUI ${kui_version} for ${loader}: ${localJar}")
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            if (localJar) {
                ivy {
                    url = localJar.parentFile.toURI()
                    patternLayout { artifact localJar.name }
                    metadataSources { artifact() }
                }
            } else {
                maven { url = 'https://maven.sighs.cc/repository/maven-public/' }
            }
        }
        filter { includeModule('io.github.kltyton.kltytonui', moduleName) }
    }
}

if (loader == 'fabric') {
    def minecraftClasspath = minecraft_version.startsWith('26.') ? 'implementation' : 'modImplementation'
    dependencies.add(minecraftClasspath, kui)
    dependencies.add('include', kui)
} else {
    dependencies.add(loader == 'forge' ? 'modImplementation' : 'implementation', kui)
    dependencies {
        jarJar(kui) {
            version { strictly "[${kui_version}]"; prefer kui_version.toString() }
        }
    }
}
