apply from: '../../gradle/common.gradle'

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (!minecraft_version.startsWith('26.')) {
        mappings loom.officialMojangMappings()
    }
    if (minecraft_version.startsWith('26.')) {
        implementation "net.fabricmc:fabric-loader:${loader_version}"
        implementation "xaero.map:xaeroworldmap-fabric-${xaero_mc_version}:${xaero_version}"
        if (project.hasProperty('auiJar')) compileOnly files(file(project.property('auiJar')))
    } else {
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "xaero.map:xaeroworldmap-fabric-${xaero_mc_version}:${xaero_version}"
        if (project.hasProperty('auiJar')) modCompileOnly files(file(project.property('auiJar')))
    }
}
