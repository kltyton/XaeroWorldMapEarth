plugins {
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
    id 'net.fabricmc.fabric-loom' version '1.18.2'
}
apply from: '../../gradle/target-conventions/fabric.gradle'

if (!project.hasProperty('kuiJar')) {
    throw new GradleException('This target requires -PkuiJar=<matching Fabric KUI JAR with the basic chunk rendering API>')
}
def localKuiJar = file(project.property('kuiJar'))
def kuiVersion
new java.util.jar.JarFile(localKuiJar).withCloseable { archive ->
    archive.getInputStream(archive.getEntry('fabric.mod.json')).withCloseable { metadata ->
        kuiVersion = new groovy.json.JsonSlurper().parse(metadata).version.toString()
    }
    ['io/github/kltyton/kltytonui/chunkmap/KuiNativeTerrainRenderer.class',
     'io/github/kltyton/kltytonui/chunkmap/KuiNativeTerrainRenderer$Draw.class',
     'io/github/kltyton/kltytonui/chunkmap/KuiNativeTerrainRenderer$GpuMesh.class',
     'io/github/kltyton/kltytonui/client/gui/KuiNativeViewport.class',
     'io/github/kltyton/kltytonui/chunkmap/KuiNativeMesh.class',
     'assets/kltytonui/kltytonui/kltytonui/runtime/mcui/mcui-oreui.kui.js'].each { entry ->
        if (archive.getEntry(entry) == null) throw new GradleException("Missing Fabric chunk rendering/component API: ${entry}")
    }
}
repositories {
    maven { url = 'https://maven.latvian.dev/releases' }
    flatDir { dirs localKuiJar.parentFile }
}
dependencies {
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2'
    runtimeOnly files(localKuiJar)
    include(group: 'io.github.kltyton.kltytonui', name: localKuiJar.name - '.jar', version: kuiVersion)
    include implementation('dev.latvian.mods:rhino:2101.2.7-build.82')
}

loom { accessWidenerPath = file('src/main/resources/xaeroearth.accesswidener') }
