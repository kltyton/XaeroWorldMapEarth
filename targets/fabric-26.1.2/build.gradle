plugins { id 'net.fabricmc.fabric-loom' version '1.18.2' }
apply from: '../../gradle/fabric.gradle'

if (!project.hasProperty('auiJar')) {
    throw new GradleException('This target requires -PauiJar=<matching Fabric AUI JAR with the chunkmap API>')
}
def localAuiJar = file(project.property('auiJar'))
def auiVersion
new java.util.jar.JarFile(localAuiJar).withCloseable { archive ->
    archive.getInputStream(archive.getEntry('fabric.mod.json')).withCloseable { metadata ->
        auiVersion = new groovy.json.JsonSlurper().parse(metadata).version.toString()
    }
    ['com/sighs/apricityui/chunkmap/AuiNativeTerrainRenderer.class',
     'com/sighs/apricityui/client/gui/AuiNativeViewport.class',
     'com/sighs/apricityui/client/gui/AuiMapEntityLayer.class',
     'assets/apricityui/apricity/apricityui/runtime/mcui/mcui-oreui.aui.js'].each { entry ->
        if (archive.getEntry(entry) == null) throw new GradleException("Missing Fabric map/component API: ${entry}")
    }
}
repositories {
    maven { url = 'https://maven.latvian.dev/releases' }
    flatDir { dirs localAuiJar.parentFile }
}
dependencies {
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2'
    runtimeOnly files(localAuiJar)
    include(group: 'com.sighs', name: localAuiJar.name - '.jar', version: auiVersion)
    include implementation('dev.latvian.mods:rhino:2101.2.7-build.82')
}
