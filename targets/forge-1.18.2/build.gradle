plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}
apply from: '../../gradle/forge.gradle'

if (!project.hasProperty('auiJar')) {
    throw new GradleException('This target requires -PauiJar=<matching Forge AUI JAR with the basic chunk rendering API>')
}
def localAuiJar = file(project.property('auiJar'))
new java.util.jar.JarFile(localAuiJar).withCloseable { archive ->
    ['com/sighs/apricityui/chunkmap/AuiNativeTerrainRenderer.class',
     'com/sighs/apricityui/chunkmap/AuiNativeTerrainRenderer$Draw.class',
     'com/sighs/apricityui/chunkmap/AuiNativeTerrainRenderer$GpuMesh.class',
     'com/sighs/apricityui/chunkmap/AuiChunkMeshBaker.class',
     'com/sighs/apricityui/chunkmap/AuiNativeMesh.class'].each { name ->
        if (archive.getEntry(name) == null) throw new GradleException("Missing Forge chunk rendering API: ${name}")
    }
}
repositories { maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
    compileOnly 'org.joml:joml:1.10.5'
    runtimeOnly files(localAuiJar)
    jarJar files(localAuiJar)
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
    jarJar(implementation('io.github.llamalad7:mixinextras-forge:0.4.1')) {
        version { strictly '[0.4.1,0.5)'; prefer '0.4.1' }
    }
    jarJar(implementation('maven.modrinth:rhino:N59eFKIq')) {
        version { strictly '[N59eFKIq]'; prefer 'N59eFKIq' }
    }
}
mixin {
    add sourceSets.main, 'xaeroearth.refmap.json'
    config 'xaeroearth.mixins.json'
}
tasks.named('jar').configure { manifest.attributes('MixinConfigs': 'xaeroearth.mixins.json') }
