plugins {
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}
apply from: '../../gradle/target-conventions/forge.gradle'

if (!project.hasProperty('kuiJar')) {
    throw new GradleException('This target requires -PkuiJar=<matching Forge KUI JAR with the basic chunk rendering API>')
}
def localKuiJar = file(project.property('kuiJar'))
new java.util.jar.JarFile(localKuiJar).withCloseable { archive ->
    ['io/github/kltyton/kltytonui/chunkmap/KuiNativeTerrainRenderer.class',
     'io/github/kltyton/kltytonui/chunkmap/KuiNativeTerrainRenderer$Draw.class',
     'io/github/kltyton/kltytonui/chunkmap/KuiNativeTerrainRenderer$GpuMesh.class',
     'io/github/kltyton/kltytonui/chunkmap/KuiChunkMeshBaker.class',
     'io/github/kltyton/kltytonui/chunkmap/KuiNativeMesh.class'].each { name ->
        if (archive.getEntry(name) == null) throw new GradleException("Missing Forge chunk rendering API: ${name}")
    }
}
repositories { maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
    compileOnly 'org.joml:joml:1.10.5'
    runtimeOnly files(localKuiJar)
    jarJar files(localKuiJar)
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
    jarJar(implementation('io.github.llamalad7:mixinextras-forge:0.4.1')) {
        version { strictly '[0.4.1,0.5)'; prefer '0.4.1' }
    }
    jarJar(implementation('maven.modrinth:rhino:N59eFKIq')) {
        version { strictly '[N59eFKIq]'; prefer 'N59eFKIq' }
    }
}
mixin {
    add sourceSets.main, 'xaeroearth.refmap.json'
    config 'xaeroearth.mixins.json'
}
tasks.named('jar').configure { manifest.attributes('MixinConfigs': 'xaeroearth.mixins.json') }
